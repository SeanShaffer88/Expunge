<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a52"/>
      <stop offset="1" stop-color="#b3141c"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>
  <!-- The letter E, being erased from the right -->
  <rect x="132" y="120" width="64" height="272" rx="14" fill="#fff"/>
  <rect x="132" y="120" width="236" height="62" rx="14" fill="url(#fade)"/>
  <rect x="132" y="225" width="168" height="62" rx="14" fill="url(#fade)"/>
  <rect x="132" y="330" width="236" height="62" rx="14" fill="url(#fade)"/>
  <!-- Particles drifting away -->
  <g fill="#fff">
    <rect x="388" y="132" width="22" height="22" rx="5" opacity="0.55"/>
    <rect x="424" y="150" width="14" height="14" rx="4" opacity="0.35"/>
    <rect x="318" y="238" width="22" height="22" rx="5" opacity="0.5"/>
    <rect x="356" y="250" width="14" height="14" rx="4" opacity="0.3"/>
    <rect x="388" y="342" width="22" height="22" rx="5" opacity="0.55"/>
    <rect x="424" y="356" width="14" height="14" rx="4" opacity="0.35"/>
    <rect x="452" y="300" width="9" height="9" rx="3" opacity="0.25"/>
  </g>
</svg>
