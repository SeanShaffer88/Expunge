[package]
name = "expunge"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
resolver = "3"
authors = ["Sean Shaffer"]
description = "Open Source Install Monitor & Uninstaller for Windows: snapshot, diff, revert."
license = "GPL-3.0-or-later"
repository = "https://github.com/SeanShaffer88/ExpungeUninstaller"
homepage = "https://github.com/SeanShaffer88/ExpungeUninstaller"
readme = "README.md"
keywords = ["uninstaller", "windows", "install-monitor", "registry", "snapshot"]
categories = ["command-line-utilities", "os::windows-apis", "gui"]
build = "build.rs"

[lib]
name = "expunge_core"
path = "src/lib.rs"

[[bin]]
name = "expunge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
walkdir = "2"
sha2 = "0.10"
notify = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui = { version = "0.33", default-features = false }
egui_extras = { version = "0.33", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

# Development builds on Linux (for screenshots and UI checks); releases are Windows-only.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11"] }
wgpu = { version = "27", default-features = false, features = ["std", "wgsl", "vulkan", "gles", "parking_lot"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
rfd = "0.15"
wgpu = { version = "27", default-features = false, features = ["std", "wgsl", "dx12", "parking_lot"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
