name: Integration

# Real installers on a clean Windows runner: install under monitoring, remove
# with Expunge, and verify nothing the installation added is left. Runs
# weekly, on release tags, and on demand (Actions tab > Integration > Run).
on:
  schedule:
    - cron: '41 6 * * 0'
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  installer:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Installer (7-Zip MSI)
            url: https://www.7-zip.org/a/7z2409-x64.msi
            file: 7z.msi
            exe: msiexec
            args: /i|{file}|/qn|/norestart
          - name: NSIS (7-Zip)
            url: https://www.7-zip.org/a/7z2409-x64.exe
            file: 7z.exe
            exe: '{file}'
            args: /S
          - name: Inno Setup
            url: https://jrsoftware.org/download.php/is.exe?site=1
            file: is.exe
            exe: '{file}'
            args: /VERYSILENT|/SUPPRESSMSGBOXES|/NORESTART|/SP-
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Portable Expunge with a focused monitoring scope
        shell: pwsh
        run: |
          New-Item -ItemType Directory it, it/ExpungeData | Out-Null
          Copy-Item target/release/expunge.exe it/Expunge.exe
          New-Item it/portable -ItemType File | Out-Null
          @{
            first_run_done = $true
            registry_roots = @('HKLM\SOFTWARE', 'HKLM\SYSTEM\CurrentControlSet\Services', 'HKCU\Software', 'HKCU\Environment',
                               'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment')
            file_roots = @(
              @{ path = '%ProgramFiles%'; recursive = $true },
              @{ path = '%ProgramFiles(x86)%'; recursive = $true },
              @{ path = '%ProgramData%\Microsoft\Windows\Start Menu'; recursive = $true },
              @{ path = '%APPDATA%\Microsoft\Windows\Start Menu'; recursive = $true },
              @{ path = '%PUBLIC%\Desktop'; recursive = $false },
              @{ path = '%USERPROFILE%\Desktop'; recursive = $false }
            )
          } | ConvertTo-Json -Depth 5 | Set-Content it/ExpungeData/settings.json
      - name: Download installer
        shell: pwsh
        run: Invoke-WebRequest -Uri "${{ matrix.url }}" -OutFile "$env:RUNNER_TEMP\${{ matrix.file }}"
      - name: Install under monitoring
        id: monitor
        shell: pwsh
        run: |
          $file = "$env:RUNNER_TEMP\${{ matrix.file }}"
          $exe = '${{ matrix.exe }}'.Replace('{file}', $file)
          $argv = '${{ matrix.args }}'.Replace('{file}', $file).Split('|')
          # Expunge.exe is a GUI-subsystem program, so PowerShell would not wait
          # for it; Start-Process -Wait does.
          $all = @('monitor', '--no-prompt', '--json', '--', $exe) + $argv | ForEach-Object { if ($_ -match ' ') { '"' + $_ + '"' } else { $_ } }
          $p = Start-Process ./it/Expunge.exe -ArgumentList $all -Wait -PassThru -NoNewWindow -RedirectStandardOutput out.json -RedirectStandardError err.txt
          $code = $p.ExitCode
          $json = Get-Content out.json -Raw
          Get-Content err.txt | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Get-Content err.txt | Select-Object -Last 20 | ForEach-Object { Write-Output "::error::$_" }
            throw "monitor failed (exit $code)"
          }
          $log = $json | ConvertFrom-Json
          "Recorded $($log.name) $($log.version): $($log.stats | ConvertTo-Json -Compress)"
          if (-not $log.uninstall_key) { throw "the installation registered no uninstall entry" }
          "id=$($log.id)" >> $env:GITHUB_OUTPUT
          "name=$($log.name)" >> $env:GITHUB_OUTPUT
      - name: Lint the installation
        shell: pwsh
        run: ./it/Expunge.exe lint ${{ steps.monitor.outputs.id }} | Out-Host; exit 0
      - name: Remove with Expunge
        shell: pwsh
        run: |
          $p = Start-Process ./it/Expunge.exe -ArgumentList 'revert', '${{ steps.monitor.outputs.id }}', '--keep-log' -Wait -PassThru -NoNewWindow -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $out = (Get-Content out.txt) + (Get-Content err.txt)
          $out | ForEach-Object { Write-Host $_ }
          if ($p.ExitCode -ne 0) { $out | Select-String 'FAIL' | Select-Object -First 20 | ForEach-Object { Write-Output "::error::$_" }; throw "revert reported failures" }
      - name: Verify nothing is left
        shell: pwsh
        run: |
          $p = Start-Process ./it/Expunge.exe -ArgumentList 'check-clean', '${{ steps.monitor.outputs.id }}' -Wait -PassThru -NoNewWindow -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $out = (Get-Content out.txt) + (Get-Content err.txt)
          $out | ForEach-Object { Write-Host $_ }
          if ($p.ExitCode -ne 0) { $out | Select-Object -First 25 | ForEach-Object { Write-Output "::error::$_" }; throw "leftovers remain" }
          $still = ./it/Expunge.exe programs | Out-String -Stream | Select-String -SimpleMatch "${{ steps.monitor.outputs.name }}"
          if ($still) { throw "the program is still listed: $still" }
