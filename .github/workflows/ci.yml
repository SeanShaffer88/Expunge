name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test --lib --locked 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Surface the failure as annotations so it is visible without the log.
            Get-Content test.log | Select-String -Pattern '^error|^warning: unused|panicked|FAILED|^test result|left:|right:|^\s+-->' |
              Select-Object -Last 45 | ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit $code
          }
      - name: Clippy
        run: cargo clippy --all-targets --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Smoke test the CLI
        shell: pwsh
        run: |
          ./target/release/expunge.exe --version
          ./target/release/expunge.exe programs | Select-Object -First 5
      - name: Performance budget
        shell: pwsh
        run: |
          # Full system snapshot on the (large) CI image: time and peak memory.
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process ./target/release/expunge.exe -ArgumentList 'snapshot','perf.snap' -PassThru -NoNewWindow
          $peak = 0
          while (-not $p.HasExited) { $p.Refresh(); $peak = [Math]::Max($peak, $p.PeakWorkingSet64); Start-Sleep -Milliseconds 200 }
          $sw.Stop()
          $secs = [Math]::Round($sw.Elapsed.TotalSeconds, 1)
          $mb = [Math]::Round($peak / 1MB)
          $snapMb = [Math]::Round((Get-Item perf.snap).Length / 1MB, 1)
          $exeMb = [Math]::Round((Get-Item ./target/release/expunge.exe).Length / 1MB, 1)
          $sw2 = [Diagnostics.Stopwatch]::StartNew()
          ./target/release/expunge.exe programs --trust --json | Out-Null
          $trustSecs = [Math]::Round($sw2.Elapsed.TotalSeconds, 1)
          @"
          ### Performance
          | Measure | Value | Budget |
          |---|---|---|
          | Snapshot time | $secs s | 600 s |
          | Snapshot peak memory | $mb MB | 1500 MB |
          | Snapshot file | $snapMb MB | |
          | Program list with signatures | $trustSecs s | 120 s |
          | Expunge.exe size | $exeMb MB | |
          "@ | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Write-Host "snapshot ${secs}s, peak ${mb}MB, signatures ${trustSecs}s, exe ${exeMb}MB"
          if ($secs -gt 600 -or $mb -gt 1500 -or $trustSecs -gt 120) { throw "Performance budget exceeded" }
      - uses: actions/upload-artifact@v4
        with:
          name: Expunge-dev
          path: target/release/expunge.exe

  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --locked
