name: Release

# Build and publish the installer and portable zip. Triggered by pushing a
# tag like v0.1.0, by pushing to the `release` branch (the tag v<version> from
# Cargo.toml is created automatically), or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version from Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --lib --locked

      - name: Build
        run: cargo build --release --locked

      - name: Build for Arm64
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo build --release --locked --target aarch64-pc-windows-msvc

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Get the PortableApps.com Launcher (official source, pinned)
        shell: pwsh
        run: |
          $commit = (Select-String -Path src/patools.rs -Pattern 'LAUNCHER_COMMIT: &str = "([0-9a-f]+)"').Matches[0].Groups[1].Value
          $sha = (Select-String -Path src/patools.rs -Pattern 'MAKENSIS_SHA256: &str = "([0-9a-f]+)"').Matches[0].Groups[1].Value
          Invoke-WebRequest "https://codeload.github.com/PortableApps/Launcher/zip/$commit" -OutFile launcher.zip
          Expand-Archive launcher.zip -DestinationPath launcher-src
          $src = Get-ChildItem launcher-src -Directory | Select-Object -First 1
          New-Item -ItemType Directory "pa-tools" | Out-Null
          Copy-Item $src.FullName "pa-tools/PortableApps.com Launcher" -Recurse
          $t = "pa-tools/PortableApps.com Launcher"
          Remove-Item -Recurse -Force "$t/App/NSIS/Docs", "$t/App/NSIS/Examples", "$t/Other/Source/Manual", "$t/.github" -ErrorAction SilentlyContinue
          Get-ChildItem $t -Recurse -Filter *.chm | Remove-Item -Force
          $got = (Get-FileHash "$t/App/NSIS/makensis.exe" -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "makensis.exe doesn't match the pinned SHA-256 ($got)" }

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory dist, dist/portable | Out-Null
          Copy-Item target/release/expunge.exe dist/portable/Expunge.exe
          Copy-Item LICENSE dist/portable/LICENSE.txt
          Copy-Item README.md dist/portable/README.md
          New-Item dist/portable/portable -ItemType File | Out-Null
          Copy-Item pa-tools dist/portable/tools -Recurse
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/Expunge-$v-portable.zip"
          # Arm64 portable build (Snapdragon and other Arm PCs).
          New-Item -ItemType Directory dist/portable-arm64 | Out-Null
          Copy-Item target/aarch64-pc-windows-msvc/release/expunge.exe dist/portable-arm64/Expunge.exe
          Copy-Item LICENSE dist/portable-arm64/LICENSE.txt
          Copy-Item README.md dist/portable-arm64/README.md
          New-Item dist/portable-arm64/portable -ItemType File | Out-Null
          Copy-Item pa-tools dist/portable-arm64/tools -Recurse
          Compress-Archive -Path dist/portable-arm64/* -DestinationPath "dist/Expunge-$v-arm64-portable.zip"
          makensis "-DVERSION=$v" "-DEXE=..\target\release\expunge.exe" "-DOUTDIR=..\dist" "-DTOOLS=..\pa-tools\PortableApps.com Launcher" installer\expunge.nsi
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

      - name: Release notes
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($v))\].*?(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Value } else { "Expunge $v" }
          $notes | Set-Content dist/NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Expunge ${{ steps.ver.outputs.version }}
          make_latest: true
          body_path: dist/NOTES.md
          files: |
            dist/Expunge-Setup-*.exe
            dist/Expunge-*-portable.zip
            dist/SHA256SUMS.txt
