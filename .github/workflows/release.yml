name: Release

# Build and publish the installer and portable zip. Triggered by pushing a
# tag like v0.1.0, by pushing to the `release` branch (the tag v<version> from
# Cargo.toml is created automatically), or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version from Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --lib --locked

      - name: Build
        run: cargo build --release --locked

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory dist, dist/portable | Out-Null
          Copy-Item target/release/expunge.exe dist/portable/Expunge.exe
          Copy-Item LICENSE dist/portable/LICENSE.txt
          Copy-Item README.md dist/portable/README.md
          New-Item dist/portable/portable -ItemType File | Out-Null
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/Expunge-$v-portable.zip"
          makensis "-DVERSION=$v" "-DEXE=..\target\release\expunge.exe" "-DOUTDIR=..\dist" installer\expunge.nsi
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

      - name: Release notes
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($v))\].*?(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Value } else { "Expunge $v" }
          $notes | Set-Content dist/NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Expunge ${{ steps.ver.outputs.version }}
          make_latest: true
          body_path: dist/NOTES.md
          files: |
            dist/Expunge-Setup-*.exe
            dist/Expunge-*-portable.zip
            dist/SHA256SUMS.txt
